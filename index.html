<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小永遠世界盃</title>
  <!-- 引入截圖套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #f8f6f4;
      --card-bg: #ffffff;
      --primary: #c96872;
      --primary-hover: #b0535d;
      --text: #222222;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 10px;
    }
    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .game-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .game-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 10px;
      color: #666;
      font-size: 0.95rem;
    }
    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: #eee;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }
    .battle-box {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      min-height: 220px;
    }
    .option-card {
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 20px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      min-height: 160px;
      transition: all 0.2s ease;
      user-select: none;
      line-height: 1.4;
    }
    .option-card:hover, .option-card:active {
      border-color: var(--primary);
      background: #fffafa;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(201, 104, 114, 0.18);
    }
    .vs-badge {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--primary);
      padding: 6px 10px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ddd;
    }

    /* 結果截圖卡片 */
    .result-section {
      display: none;
    }
    #capture-card {
      background: #ffffff;
      padding: 24px 16px;
      border-radius: 8px;
      color: #000;
    }
    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
      font-size: 1.25rem;
      font-weight: bold;
    }
    .author-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .author-line {
      border: none;
      border-bottom: 2px solid #000;
      outline: none;
      font-size: 1.15rem;
      font-weight: bold;
      width: 160px;
      padding: 2px 4px;
      background: transparent;
    }
    .watermark {
      font-size: 0.95rem;
      color: #444;
      font-weight: 500;
    }
    .bracket-table-wrap {
      width: 100%;
      border: 2px solid #000;
      background: #fff;
      overflow-x: auto;
    }
    .bracket-table {
      width: 100%;
      min-width: 580px;
      border-collapse: collapse;
      font-size: 0.8rem;
      color: #000;
      table-layout: fixed;
    }
    .table-title {
      border-bottom: 2px solid #000;
      text-align: center;
      padding: 6px;
      font-size: 1.05rem;
      font-weight: bold;
      background: #fff;
      letter-spacing: 2px;
    }
    .bracket-table td {
      border: 1px solid #000;
      padding: 4px 3px;
      text-align: center;
      word-break: break-word;
      line-height: 1.25;
      font-weight: 500;
    }
    .col-32 { width: 33%; }
    .col-16 { width: 21%; }
    .col-8  { width: 18%; }
    .col-4  { width: 15%; }
    .col-2  { width: 13%; }

    .winner-footer {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: bold;
    }
    .trophy-icon {
      font-size: 2rem;
      line-height: 1;
    }
    .winner-line-wrap {
      flex: 1;
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
      display: flex;
      align-items: center;
    }
    .winner-highlight-text {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 1px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-btn.secondary {
      background: #666;
    }
    .action-btn:hover {
      opacity: 0.9;
    }
    @media (max-width: 600px) {
      .battle-box {
        grid-template-columns: 1fr;
      }
      .vs-badge {
        display: none;
      }
      .option-card {
        min-height: 95px;
      }
      .author-line {
        width: 120px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 遊戲區 -->
    <div id="game-view">
      <div class="game-header">
        <div class="game-title">小永遠世界盃</div>
        <div style="font-size: 0.85rem; color: #777;">點選你心中的最佳選項！</div>
      </div>
      <div class="status-bar">
        <span id="round-name">32 強賽</span>
        <span id="match-progress">1 / 16</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div class="battle-box">
        <div id="option-a" class="option-card" onclick="chooseWinner(0)"></div>
        <div class="vs-badge">VS</div>
        <div id="option-b" class="option-card" onclick="chooseWinner(1)"></div>
      </div>
    </div>

    <!-- 結果與歷程區 -->
    <div id="result-view" class="result-section">
      <div id="capture-card">
        <div class="card-top-bar">
          <div class="author-input-wrap">
            <span>填表人：</span>
            <input type="text" id="user-name-input" class="author-line" placeholder="點此輸入名字" />
          </div>
          <div class="watermark">@Byzhenwei0329</div>
        </div>

        <div class="bracket-table-wrap">
          <table class="bracket-table" id="bracket-table">
            <thead>
              <tr>
                <th colspan="5" class="table-title">小永遠世界盃</th>
              </tr>
            </thead>
            <tbody id="bracket-body"></tbody>
          </table>
        </div>

        <div class="winner-footer">
          <span class="trophy-icon">🏆</span>
          <span style="font-size: 1.4rem;">:</span>
          <div class="winner-line-wrap">
            <span id="winner-text" class="winner-highlight-text"></span>
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button class="action-btn" onclick="saveAsImage()">📸 下載完整結果圖</button>
        <button class="action-btn" onclick="copyImageToClipboard()">📋 複製圖片</button>
        <button class="action-btn secondary" onclick="restartGame()">🔄 重新測驗</button>
      </div>
    </div>
  </div>

  <script>
    // 這裡放你的 32 個選項（可自行替換修改）
    const originalItems = [
      "出道戰一牽定情", "哥是我的靈魂伴侶", "橡子理論", "你對我的喜歡是那種喜歡嗎",
      "我喜歡普通", "不是老公因為還沒蓋章", "我和哥是一體的", "李糯哥是只屬於我一個人的",
      "養在魚缸裡的金魚", "別墅理論", "知城是飛蛾", "和我在一起的時候最幸福吧",
      "我們韓尼更漂亮", "1月1日D社情侶", "大寶貝和小寶貝", "他和我吃飯不吃辣",
      "want so bad", "李科長韓代理", "洗完澡跳電臀舞", "親後頸",
      "我們其實可以不做戀人", "章魚告白", "你也是男朋友", "抱抱只有韓尼沒關係",
      "誤闖隊友直播", "到底吃了什麼肉", "我們就是命運", "要拍新的結婚照",
      "情侶手鍊", "因為天氣剛剛好", "電梯調情", "直播換飲料"
    ];

    let currentRoundCandidates = [];
    let nextRoundCandidates = [];
    let currentMatchIndex = 0;
    let historyTree = [];

    function initGame() {
      currentRoundCandidates = [...originalItems];
      nextRoundCandidates = [];
      currentMatchIndex = 0;
      historyTree = [[...originalItems], [], [], [], [], []];

      document.getElementById("game-view").style.display = "block";
      document.getElementById("result-view").style.display = "none";
      renderMatch();
    }

    function getRoundTitle(count) {
      if (count === 32) return "32 強賽";
      if (count === 16) return "16 強賽";
      if (count === 8) return "8 強半準決賽";
      if (count === 4) return "4 強準決賽";
      if (count === 2) return "最終決賽";
      return "比賽進行中";
    }

    function renderMatch() {
      const totalMatches = currentRoundCandidates.length / 2;
      const currentMatch = currentMatchIndex + 1;
      
      document.getElementById("round-name").innerText = getRoundTitle(currentRoundCandidates.length);
      document.getElementById("match-progress").innerText = `${currentMatch} / ${totalMatches}`;
      
      const percent = ((currentMatch - 1) / totalMatches) * 100;
      document.getElementById("progress-fill").style.width = `${percent}%`;

      document.getElementById("option-a").innerText = currentRoundCandidates[currentMatchIndex * 2];
      document.getElementById("option-b").innerText = currentRoundCandidates[currentMatchIndex * 2 + 1];
    }

    function chooseWinner(selectedIndex) {
      const winner = currentRoundCandidates[currentMatchIndex * 2 + selectedIndex];
      nextRoundCandidates.push(winner);
      
      const currentRoundLevel = Math.log2(32 / currentRoundCandidates.length) + 1;
      historyTree[currentRoundLevel].push(winner);

      currentMatchIndex++;

      if (currentMatchIndex * 2 >= currentRoundCandidates.length) {
        if (nextRoundCandidates.length === 1) {
          showResults(nextRoundCandidates[0]);
          return;
        }
        currentRoundCandidates = [...nextRoundCandidates];
        nextRoundCandidates = [];
        currentMatchIndex = 0;
      }

      renderMatch();
    }

    function showResults(winner) {
      document.getElementById("game-view").style.display = "none";
      document.getElementById("result-view").style.display = "block";
      document.getElementById("winner-text").innerText = winner;
      buildBracketTable();
    }

    function buildBracketTable() {
      const tbody = document.getElementById("bracket-body");
      tbody.innerHTML = "";

      for (let i = 0; i < 32; i++) {
        const tr = document.createElement("tr");

        const td32 = document.createElement("td");
        td32.className = "col-32";
        td32.innerText = historyTree[0][i];
        tr.appendChild(td32);

        if (i % 2 === 0) {
          const td16 = document.createElement("td");
          td16.className = "col-16";
          td16.rowSpan = 2;
          td16.innerText = historyTree[1][i / 2] || "";
          tr.appendChild(td16);
        }

        if (i % 4 === 0) {
          const td8 = document.createElement("td");
          td8.className = "col-8";
          td8.rowSpan = 4;
          td8.innerText = historyTree[2][i / 4] || "";
          tr.appendChild(td8);
        }

        if (i % 8 === 0) {
          const td4 = document.createElement("td");
          td4.className = "col-4";
          td4.rowSpan = 8;
          td4.innerText = historyTree[3][i / 8] || "";
          tr.appendChild(td4);
        }

        if (i % 16 === 0) {
          const tdFinal = document.createElement("td");
          tdFinal.className = "col-2";
          tdFinal.rowSpan = 16;
          tdFinal.innerText = historyTree[4][i / 16] || "";
          tr.appendChild(tdFinal);
        }

        tbody.appendChild(tr);
      }
    }

    function saveAsImage() {
      const card = document.getElementById("capture-card");
      html2canvas(card, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
        const link = document.createElement("a");
        const userName = document.getElementById("user-name-input").value.trim();
        link.download = userName ? `小永遠世界盃_${userName}.png` : "小永遠世界盃_結果.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    function copyImageToClipboard() {
      const card = document.getElementById("capture-card");
      html2canvas(card, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
        canvas.toBlob(blob => {
          if (navigator.clipboard && navigator.clipboard.write) {
            navigator.clipboard.write([
              new ClipboardItem({ "image/png": blob })
            ]).then(() => {
              alert("已將完整結果圖複製到剪貼簿，可直接貼上分享！");
            }).catch(() => {
              alert("複製失敗，請點選「下載完整結果圖」。");
            });
          } else {
            alert("目前瀏覽器不支援直接複製，請直接點選「下載完整結果圖」。");
          }
        });
      });
    }

    function restartGame() {
      document.getElementById("user-name-input").value = "";
      initGame();
    }

    initGame();
  </script>
</body>
</html>
